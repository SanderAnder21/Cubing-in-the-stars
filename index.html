<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0614">
  <title>Cubing in the Stars</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <button id="menu" aria-label="Abrir estante">☰ Estante</button>

      <div id="shelf"></div>
    </aside>
    <div id="backdrop"></div>
    <main id="view-timer"></main>
  </div>
  <script type="module" src="main.js"></script>

</html>
